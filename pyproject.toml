[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grid-ice-vision"
version = "0.1.0"
description = "Grid icing and precipitation recognition from images"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "timm>=1.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "scikit-image>=0.24",
  "scipy>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "pillow>=10.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.31", "python-multipart"]
deploy = ["onnx>=1.16", "onnxruntime>=1.19", "onnxscript>=0.1"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "httpx>=0.27"]
aug = ["albumentations>=1.4"]

[project.scripts]
giv = "grid_ice_vision.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_ice_vision"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# N812: `import torch.nn.functional as F` 是 PyTorch 社区惯例，不视为违规
# N803/N806: 与论文记号保持一致（X, W_ice 等）
ignore = ["N803", "N806", "N812", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
# numpy / torch 的类型存根对多数算子返回 Any，且部分内部函数未标注；
# 这两类噪音在 strict 下无法通过，单独关闭，其余检查保持开启。
disable_error_code = ["no-any-return", "no-untyped-call"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

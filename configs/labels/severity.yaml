# 视觉等级 G0–G4 阈值（§8.5）
# ⚠️ 初始值，须在真实标注数据上按覆盖率分布校准后回写；
#    G 级是项目内部指标，不得等同于任何电力行业规程等级。
version: "1.0.0"

metric: coverage_ratio        # ice / (ice + exposed)
denominator: effective_asset_pixels

grades:
  G0:
    max_coverage: 0.03
    morphology: "轮廓清晰，无明显增厚"
  G1:
    max_coverage: 0.15
    morphology: "边缘轻微增厚，导线轮廓基本保持"
  G2:
    max_coverage: 0.30
    morphology: "轮廓明显改变，可见冰壳/短冰柱"
  G3:
    max_coverage: 0.50
    morphology: "形态显著畸变，可见下垂/偏心/桥接"
  G4:
    max_coverage: null
    morphology: "大面积冰壳，跨导线桥接，或伴随明显弧垂"

calibration:
  method: quantile
  target_distribution: "按现场标注集的分位数重定阈值"
  last_calibrated: null

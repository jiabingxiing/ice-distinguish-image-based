# 覆冰分割/类型数据参数
data:
  size: 512
  manifest: data/manifests/icing_v1.jsonl
  mask_suffix: _mask.png

# 合成数据隔离（§11.4）
synthetic:
  only_in_train: true
  require_zero_error_truth: true
  texture_source: data/raw/textures

# 少样本策略：禁止将少数类并入 mixed，避免污染混合凇物理语义
rare_class_policy: keep_label_and_augment_or_collect
reject_policy: confidence_and_margin_threshold

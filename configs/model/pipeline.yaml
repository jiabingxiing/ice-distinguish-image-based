# 全链路推理配置（服务/CLI 默认入口）
device: cpu

model:
  backbone: mobilenetv4_conv_small
  pretrained: false
  precip:
    use_film: true
  detector:
    reg_max: 8

weights:
  precip: null            # artifacts/precip/precip-0.1.0/best.pt
  detector: null
  seg: null
  calibration: configs/model/precip_calibration.json

evidence_dir: artifacts/evidence

infer:
  precip:
    lam: 0.30
    tau_reject: 0.45
    h_max: 1.80
  detector:
    score_thr: 0.30
    nms_thr: 0.50
    tile: 640
    overlap: 0.20
  seg:
    input_size: 512
    min_coverage: 0.03

# 以下三段与独立配置文件同构，便于一次加载
quality:
  blur_degraded: 0.60
  blur_unusable: 0.80
  exposure_degraded: 0.25
  exposure_unusable: 0.45
  block_energy_degraded: 0.15
  block_energy_unusable: 0.05
  night_mean_gray: 20.0
  grid: [6, 8]
  lens_window: 5
  lens_frames: 3

severity:
  grades:
    G0: {max_coverage: 0.03}
    G1: {max_coverage: 0.15}
    G2: {max_coverage: 0.30}
    G3: {max_coverage: 0.50}
    G4: {max_coverage: null}
  # 密度折算：结果里会带 rho_kg_m3 / rho_source，便于审计
  rho:
    default: 900
    by_type: {glaze: 900, rime: 350, mixed: 600, none: 900, unknown: 900}
  ice_type:
    # none_rule：G0→none，其余→unknown（不猜）。heuristic/model 未验证前禁止开启
    mode: none_rule
  # 绝缘子 Track A：面积变化率 Pa、桥接率、横/纵向偏冰分布（计划 §3.4.4）
  # ⚠️ 阈值为初值，须在 M2 分割权重到位后用复核掩码校准回写；
  #    当前偏冰分布判定**未经有效验证**（见 artifacts/reports/m3_track_a_smoke.json）。
  insulator_pa:
    band_all_min: 0.60        # 三带冰密度都 ≥ 该值 → 判「全部覆冰」
    band_contrast_min: 0.25   # 带间密度差 < 该值 → 视为均匀，判「全部覆冰」
    uniform_tol: 0.15         # 横向左右冰量占比差 ≤ 该值 → 判「均匀」
    min_ice_px: 8             # 低于该像素数的冰视为噪声
    min_asset_px: 200         # 有效设备像素低于该值 → reliable=False，转人工复核

# 同终端无冰基准匹配（计划 §3.3 BASE）
baseline:
  iou_min: 0.60              # 计划 §3.3 规定 0.6
  ecc_corr_min: 0.60         # 配准相关下限；低于该值视为机位漂移，弃用基准
  max_candidates: 3          # 每次最多配准的候选数（控制时延）
  max_age_hours: 0.0         # 0 = 不限时间跨度
  allow_unregistered: false  # 默认禁止「不配准直接用」，宁可不给 Pa

alarm:
  version: "1.0.0"
  require_measured: true
  levels:
    I:   {d_eq_mm: {min: 0.001, max: 5.0},  gamma: {min: 0.0, max: 0.3}, bridge: {min: 0.0, max: 0.2}}
    II:  {d_eq_mm: {min: 5.0, max: 10.0},   gamma: {min: 0.3, max: 0.5}, bridge: {min: 0.2, max: 0.5}}
    III: {d_eq_mm: {min: 10.0, max: 20.0},  gamma: {min: 0.5, max: 0.8}, bridge: {min: 0.5, max: 0.8}}
    IV:  {d_eq_mm: {min: 20.0, max: null},  gamma: {min: 0.8, max: null}, bridge: {min: 0.8, max: null}}
  debounce:
    escalate_frames: 3
    deescalate_frames: 5
  ekf:
    # 固定步长兜底值：仅在调用方未提供真实 Image_Time 间隔时使用。
    # 实测 SCUT 真实采样间隔中位 2.0 h、45.3% 落在 1–6 h，因此 15 min 只作兜底，
    # 正常链路应经 InferencePipeline.run(history_timestamps=...) 传入真实间隔。
    dt_minutes: 15
    growth_rate_max_mm_per_h: 3.0
    innovation_gate_sigma: 3.0
    process_noise: {d: 0.5, rate: 0.2}
    measurement_noise_mm: 1.5
